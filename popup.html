<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JUFO Scholar — Custom Mappings</title>
  <style>
    body { font-family: sans-serif; font-size: 13px; margin: 0; padding: 12px; width: 480px; }
    h2 { margin: 0 0 10px; font-size: 14px; }
    #mappings-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    #mappings-table th { text-align: left; border-bottom: 1px solid #ccc; padding: 4px 6px; }
    #mappings-table td { padding: 4px 6px; vertical-align: top; word-break: break-word; }
    #mappings-table tr:nth-child(even) td { background: #f7f7f7; }
    .del-btn { cursor: pointer; color: #c00; border: none; background: none; font-size: 13px; padding: 0 4px; }
    #add-row { display: flex; gap: 6px; align-items: flex-start; }
    #add-row input { flex: 1; padding: 4px 6px; font-size: 13px; border: 1px solid #aaa; border-radius: 3px; }
    #add-btn { padding: 4px 10px; font-size: 13px; cursor: pointer; }
    #empty-msg { color: #888; font-style: italic; padding: 4px 6px; }
    #ranking-section, #status-section { margin-bottom: 12px; }
    #ranking-system { font-size: 13px; padding: 3px 6px; }
    #ranking-note { margin-top: 6px; padding: 6px 8px; font-size: 12px; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; border-radius: 4px; }
    #status-section { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #data-status { color: #555; }
    #refresh-btn { padding: 3px 8px; font-size: 12px; cursor: pointer; }
    #refresh-btn:disabled { opacity: 0.6; cursor: default; }
    hr { border: none; border-top: 1px solid #ccc; margin: 0 0 12px; }
  </style>
</head>
<body>
  <div id="ranking-section">
    <h2>Ranking system</h2>
    <select id="ranking-system">
      <option value="fi">Finland (JUFO)</option>
      <option value="no">Norway (NPI)</option>
    </select>
    <div id="ranking-note" style="display: none;">⚠️ Norway ranking data hasn't been manually verified yet — double-check levels before relying on them.</div>
  </div>

  <div id="status-section">
    <span id="data-status">JUFO data last refreshed: …</span>
    <button id="refresh-btn" type="button">Refresh now</button>
  </div>

  <hr>

  <h2>Custom venue mappings</h2>
  <table id="mappings-table">
    <thead><tr><th>Scholar venue</th><th>JUFO entry name</th><th></th></tr></thead>
    <tbody id="mappings-body"></tbody>
  </table>
  <div id="add-row">
    <input id="src-input" type="text" placeholder="Scholar venue name">
    <input id="dst-input" type="text" placeholder="JUFO entry name">
    <button id="add-btn">Add</button>
  </div>
  <!-- No-op on Firefox (which already has a native `browser` global); makes
       it available under Chrome too, so popup.js can use the same browser.*
       calls on both targets. -->
  <script src="lib/browser-polyfill.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
