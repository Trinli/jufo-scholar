<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#860387"/>
      <stop offset="100%" stop-color="#5212CA"/>
    </linearGradient>
  </defs>
  <!-- Viola tricolor rounded background: the flower's own vivid magenta (upper petals)
       shifting to its vivid blue-violet (lower petals) — colors sampled directly from
       a reference photo of the flower. -->
  <rect width="48" height="48" rx="10" fill="url(#g)"/>
  <!-- Bold serif J in the flower's own bright yellow centre color, sampled from the same photo. -->
  <text x="24" y="40"
        font-family="Georgia,'Times New Roman',serif"
        font-size="36"
        font-weight="bold"
        text-anchor="middle"
        fill="#FEE002"
        stroke="#2A0A40"
        stroke-width="1.5"
        paint-order="stroke fill">J</text>
</svg>
